[project]
name = "resume-as-code"
version = "0.1.0"
description = "CLI tool for git-native resume generation from structured work units"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Joshua Magady" },
]
dependencies = [
  "click>=8.1",
  "pyyaml>=6.0",
  "ruamel.yaml>=0.18",
  "pydantic>=2.0",
  "jsonschema>=4.20",
  "jinja2>=3.1",
  "weasyprint>=60",
  "python-docx>=1.1",
  "docxtpl>=0.16",
  "sentence-transformers>=2.2",
  "rank-bm25>=0.2",
  "rich>=13",
  "httpx>=0.27",
]

[project.scripts]
resume = "resume_as_code.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov",
  "mypy",
  "ruff",
  "pre-commit",
  "respx>=0.21.1",
]
llm = [
  "anthropic>=0.25",
  "openai>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resume_as_code"]

# Include data files (YAML configs) in the package
[tool.hatch.build.targets.wheel.force-include]
"src/resume_as_code/data" = "resume_as_code/data"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[dependency-groups]
dev = [
    "types-pyyaml>=6.0.12.20250915",
]
