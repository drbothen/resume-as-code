# BMM Workflow Status
# This tracks progress through BMM methodology Analysis, Planning, and Solutioning phases.
# Implementation phase is tracked separately in sprint-status.yaml

# STATUS DEFINITIONS:
# ==================
# Initial Status (before completion):
#   - required: Must be completed to progress
#   - optional: Can be completed but not required
#   - recommended: Strongly suggested but not required
#   - conditional: Required only if certain conditions met (e.g., if_has_ui)
#   - included: Optional workflow that user chose to include
#
# Completion Status:
#   - {file-path}: File created/found (e.g., "docs/product-brief.md")
#   - skipped: Optional/conditional workflow that was skipped

generated: "2026-01-09"
project: "resume"
project_type: "Resume as Code"
selected_track: "method"
field_type: "greenfield"
workflow_path: "method-greenfield.yaml"

workflow_status:
  # Phase 1: Analysis (Optional - user selected all)
  phase_1_analysis:
    name: "Analysis"
    optional: true
    workflows:
      brainstorm-project:
        status: "_bmad-output/analysis/brainstorming-session-2026-01-09.md"
        agent: "analyst"
        command: "/bmad:bmm:workflows:brainstorming"
        note: "Creative exploration and ideation"
        completed: "2026-01-09"

      research:
        status: "_bmad-output/planning-artifacts/research/comprehensive-resume-as-code-research-2026-01-09.md"
        agent: "analyst"
        command: "/bmad:bmm:workflows:research"
        note: "Technical/competitive analysis"
        completed: "2026-01-09"

      product-brief:
        status: "_bmad-output/planning-artifacts/product-brief-resume-2026-01-09.md"
        agent: "analyst"
        command: "/bmad:bmm:workflows:create-product-brief"
        note: "Strategic product planning"
        completed: "2026-01-09"

  # Phase 2: Planning
  phase_2_planning:
    name: "Planning"
    required: true
    workflows:
      prd:
        status: "required"
        agent: "pm"
        command: "/bmad:bmm:workflows:create-prd"
        output: "Product Requirements Document with FRs and NFRs"

      create-ux-design:
        status: "conditional"
        condition: "if_has_ui"
        agent: "ux-designer"
        command: "/bmad:bmm:workflows:create-ux-design"
        note: "Determined after PRD - user/agent decides if needed"

  # Phase 3: Solutioning
  phase_3_solutioning:
    name: "Solutioning"
    required: true
    workflows:
      create-architecture:
        status: "required"
        agent: "architect"
        command: "/bmad:bmm:workflows:create-architecture"
        output: "System architecture document"

      create-epics-and-stories:
        status: "required"
        agent: "pm"
        command: "/bmad:bmm:workflows:create-epics-and-stories"
        note: "Break down PRD into implementable epics and stories"

      test-design:
        status: "optional"
        agent: "tea"
        command: "/bmad:bmm:workflows:test-design"
        output: "System-level testability review"

      implementation-readiness:
        status: "required"
        agent: "architect"
        command: "/bmad:bmm:workflows:implementation-readiness"
        note: "Validates PRD + Architecture + Epics + UX"

  # Phase 4: Implementation
  phase_4_implementation:
    name: "Implementation"
    required: true
    workflows:
      sprint-planning:
        status: "required"
        agent: "sm"
        command: "/bmad:bmm:workflows:sprint-planning"
        note: "Creates sprint plan - subsequent work tracked in sprint-status.yaml"
