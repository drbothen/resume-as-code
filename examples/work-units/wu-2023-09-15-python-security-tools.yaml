position_id: "pos-industrialtech-senior"

title: "Engineered Python security automation suite reducing vulnerability remediation time 70%"

problem:
  statement: |
    Security team manually correlated findings from 5 different scanning tools,
    creating 3-day lag in vulnerability triage. High false positive rate
    caused developer fatigue and ignored findings.

  constraints:
    - "Must integrate with existing ticketing and SIEM systems"
    - "Handle 10K+ daily findings across enterprise portfolio"
    - "Maintain audit trail for compliance requirements"

  context: |
    Supporting vulnerability management program for 200+ applications
    with 2-person security operations team.

actions:
  - "Designed event-driven architecture using Python async for high throughput"
  - "Built intelligent deduplication engine reducing noise by 80%"
  - "Implemented risk-based prioritization using CVSS and asset criticality"
  - "Created automated ticketing workflow with SLA tracking"
  - "Developed API integrations for Qualys, Snyk, and Prisma Cloud"
  - "Built dashboard providing real-time vulnerability metrics"

outcome:
  result: |
    Reduced mean time to remediation from 45 days to 14 days.
    Processing 15K+ findings daily with 95% automation rate.

  quantified_impact: "70% faster remediation, 80% reduction in false positives"

  business_value: |
    Enabled security team to scale coverage without headcount increase.
    Improved audit readiness with real-time compliance visibility.

