# Leadership and Mentorship Work Unit
schema_version: "1.0.0"

id: "wu-2023-12-01-team-mentorship"

title: "Mentored team of 4 junior engineers establishing cloud security center of excellence"

problem:
  statement: |
    Growing organization lacked cloud security expertise. Junior engineers
    had strong fundamentals but limited practical experience with AWS
    security architecture and IaC practices.

  constraints:
    - "Engineers split across 3 time zones"
    - "Balance mentorship with project delivery commitments"
    - "No formal training budget allocated"

  context: |
    Part of strategic initiative to build internal cloud security capability
    rather than relying on external consultants.

actions:
  - "Designed 12-week structured learning program covering AWS security and Terraform"
  - "Conducted weekly architecture review sessions analyzing real project challenges"
  - "Paired junior engineers with senior resources on critical projects"
  - "Created internal documentation repository with security patterns and anti-patterns"
  - "Established code review culture with security-focused review checklist"
  - "Guided 2 engineers through AWS Security Specialty certification prep"

outcome:
  result: |
    All 4 engineers achieved independent contributor status within 6 months.
    Team now handles 80% of cloud security assessments independently.

  quantified_impact: "100% certification pass rate, 4x team capacity increase"

  business_value: |
    Reduced external consulting spend by $400K annually. Created sustainable
    talent pipeline for security organization growth.

time_started: "2023-06-01"
time_ended: "2023-12-01"

skills_demonstrated:
  - name: "Technical Mentorship"
  - name: "Team Leadership"
  - name: "Training Development"
  - name: "AWS Security"
  - name: "Knowledge Management"

confidence: high

